spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.mailtrap.io
    port: 587
    username: your_mailtrap_username
    password: your_mailtrap_password

server:
  port: 8081

jwt:
  secret: your-super-secret-key-change-this-in-production
  expiration: 86400000